[package]
name = "standby"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nick Paterno <nick@epistates.com>"]
license = "MIT OR Apache-2.0"
description = "Cross-platform sleep, timeout and wait: run a command under a time limit that stops its whole process tree, with GNU-compatible exit codes"
repository = "https://github.com/epistates/standby"
documentation = "https://docs.rs/standby"
readme = "README.md"
keywords = ["sleep", "timeout", "wait", "process", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32.0", features = ["event", "poll", "process", "resource", "signal", "term", "time"] }
signal-hook = "0.4.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
