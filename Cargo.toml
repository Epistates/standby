[package]
name = "standby"
version = "0.2.0"
edition = "2024"
authors = ["Nick Paterno <nick@epistates.com>"]
license = "MIT OR Apache-2.0"
description = "A world-class cross-platform time management tool for sleep, timeout, and wait operations with full POSIX compliance and GNU coreutils compatibility"
repository = "https://github.com/epistates/standby"
homepage = "https://github.com/epistates/standby"
documentation = "https://docs.rs/standby"
readme = "README.md"
keywords = ["sleep", "timeout", "wait", "time", "posix"]
categories = ["command-line-utilities"]
exclude = [".git*", ".claude", "target/", "*.swp", "*.swo", ".DS_Store"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "handleapi", "processthreadsapi", "winbase"] }

[lib]
name = "standby"
path = "src/lib.rs"

[[bin]]
name = "standby"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
